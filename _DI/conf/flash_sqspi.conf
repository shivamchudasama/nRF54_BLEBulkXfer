#*******************************************************************************
#
# External flash over sQSPI (FLASH_IF=sqspi): the soft QSPI peripheral that
# runs on the FLPR (RISC-V) core, as in Sample Code FS and NCS's
# samples/zephyr/drivers/spi_flash. Merged after prj.conf by the root
# CMakeLists.txt, together with _DI/boards/<board>_flash_sqspi.overlay, which
# moves mx25r64 onto the sqspi node as a jedec,mspi-nor device.
#
#*******************************************************************************
CONFIG_FSMGR_FLASH_IF_SQSPI=y

# MSPI driver of the sQSPI soft peripheral
CONFIG_MSPI=y
CONFIG_MSPI_NRF_SQSPI=y

# Erase pages of 4 KiB: the flash disk caches one page (cache-size 4096)
CONFIG_FLASH_MSPI_NOR_LAYOUT_PAGE_SIZE=4096

# The sQSPI driver manages its own power; let it work with device PM
CONFIG_PM_OVERRIDE_EXTERNAL_DRIVER_CHECK=y
