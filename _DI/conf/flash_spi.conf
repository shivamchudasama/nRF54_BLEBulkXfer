#*******************************************************************************
#
# External flash over SPI (FLASH_IF=spi, the default). Merged after prj.conf by
# the root CMakeLists.txt, together with
# _DI/boards/<board>_flash_spi.overlay. The board's mx25r64 on spi00 is a
# jedec,spi-nor device, so CONFIG_SPI_NOR is on by default.
#
#*******************************************************************************
CONFIG_FSMGR_FLASH_IF_SPI=y

# Erase pages of 4 KiB (the default is 64 KiB): the flash disk caches one page,
# and its cache-size (4096) must hold a whole one
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
